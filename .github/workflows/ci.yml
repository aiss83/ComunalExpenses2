name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (tests, APK, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # The runner image already ships the Android SDK. Recent images broke
      # android-actions/setup-android (it still tries to install the removed "tools" package),
      # so only make sure the platform required by compileSdk is present.
      - name: Ensure Android platform 36
        run: |
          SDKMANAGER=$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)
          if [ -n "$SDKMANAGER" ] && ! "$SDKMANAGER" --list_installed 2>/dev/null | grep -q "platforms;android-36"; then
            yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
            "$SDKMANAGER" "platforms;android-36" >/dev/null
          fi
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Unit tests (shared)
        run: ./gradlew :shared:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: Android Lint
        run: ./gradlew :androidApp:lintDebug --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ios:
    name: iOS target (compile)
    # Manual only: macOS runners are not available for private repositories without a paid plan,
    # and cancelling such a job on every push is just noise. Run it from the Actions tab.
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile iOS simulator target
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain
