name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android (tests, APK, lint)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Provides the Android SDK / cmdline-tools and accepts the licenses on a clean runner.
      - uses: android-actions/setup-android@v3

      - name: Unit tests (shared)
        run: ./gradlew :shared:testDebugUnitTest --console=plain

      - name: Assemble debug APK
        run: ./gradlew :androidApp:assembleDebug --console=plain

      - name: Android Lint
        run: ./gradlew :androidApp:lintDebug --console=plain

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            shared/build/reports/tests/
            shared/build/test-results/
            androidApp/build/reports/lint-results-debug.html
          if-no-files-found: ignore

  ios:
    name: iOS target (compile)
    # The macOS runner is slow and expensive, so it only runs for main branches and manually.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/multiplatform'))
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile iOS simulator target
        run: ./gradlew :shared:compileKotlinIosSimulatorArm64 --console=plain
